services:
  - type: web
    name: clothing-store-api
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    # Uncomment dan sesuaikan dengan database mu
